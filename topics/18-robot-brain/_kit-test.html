<h1>Kit test</h1>
<div class="box idea"><span class="tag">💡 The idea</span><p>A robot that can't see the cat walks straight into it.</p></div>
<div class="room" data-robot="3,1" data-path="1,1 2,1 3,1" data-cat="4,1" data-blocks="red:2,1 blue:6,3 green:1,5" data-mark="4,1" data-label="Week 1: BUMP!"></div>
